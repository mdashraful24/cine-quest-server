services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doomsdayready
      POSTGRES_PASSWORD: doomsdayready
      POSTGRES_DB: doomsdayready
    ports:
      - "5432:5432"
    volumes:
      - doomsdayready-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomsdayready -d doomsdayready"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      DATABASE_URL: postgresql://doomsdayready:doomsdayready@db:5432/doomsdayready
      FRONTEND_URL: http://localhost:3000
      SEED_ON_START: "true"
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bunx prisma migrate deploy && bun src/server.ts"

volumes:
  doomsdayready-db:

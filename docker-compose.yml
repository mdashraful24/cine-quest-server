services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinequest
      POSTGRES_PASSWORD: cinequest
      POSTGRES_DB: cinequest
    ports:
      - "5432:5432"
    volumes:
      - cinequest-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinequest -d cinequest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      DATABASE_URL: postgresql://cinequest:cinequest@db:5432/cinequest
      FRONTEND_URL: http://localhost:3000
      SEED_ON_START: "false"
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bunx prisma migrate deploy && bun run db:seed && bun src/server.ts"

volumes:
  cinequest-db:
